[package]
name = "opencode-bus-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
otel = ["dep:bus-proxy-telemetry"]
otlp = ["otel", "bus-proxy-telemetry/otlp", "dep:reqwest"]

[[test]]
name = "otlp"
required-features = ["otlp"]

[dependencies]
bus-proxy-gateway.workspace = true
bus-proxy-router.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
libc = "0.2"
serde_json.workspace = true
bus-proxy-telemetry = { workspace = true, optional = true }
# Reuse the gateway's ring provider rather than enabling a second rustls provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "blocking"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
bus-proxy-protocol.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
