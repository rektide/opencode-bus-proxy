[package]
name = "opencode-bus-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bus-proxy-gateway.workspace = true
bus-proxy-router.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
libc = "0.2"
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "http-json", "reqwest-blocking-client"] }
# Reuse the gateway's ring provider rather than enabling a second rustls provider.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
tracing-opentelemetry = { version = "0.34", default-features = false }

[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
