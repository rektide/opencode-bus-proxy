[workspace]
members = ["components/protocol", "components/router", "components/gateway", "components/service-manager", "components/discovery", "cli/daemon", "telemetry/core", "telemetry/arrow", "telemetry/clickhouse-native"]
default-members = ["components/protocol", "components/router", "components/gateway", "components/service-manager", "components/discovery", "cli/daemon"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
bus-proxy-protocol = { path = "components/protocol" }
bus-proxy-router = { path = "components/router" }
bus-proxy-gateway = { path = "components/gateway" }
bus-proxy-discovery = { path = "components/discovery" }
bus-proxy-telemetry = { path = "telemetry/core", default-features = false }
bus-proxy-clickhouse-native = { version = "0.1.0", path = "telemetry/clickhouse-native", default-features = false }
bus-proxy-export-arrow = { version = "0.1.0", path = "telemetry/arrow", default-features = false }
arrow-array = { version = "57", default-features = false }
arrow-schema = { version = "57", default-features = false }
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false }
tracing-opentelemetry = { version = "0.34", default-features = false }
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "webpki-roots", "ring", "tls12"] }
clap = { version = "4", features = ["derive", "env"] }

[profile.release]
lto = "thin"
codegen-units = 1
