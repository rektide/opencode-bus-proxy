# Opt-in user-service drop-in, not installed automatically. Keep the service
# self-binding; a socket-unit-only listener is not yet a cooperative capability.
# Preserve the existing upstream/listen/credential configuration. An old binary
# needs one deliberate bootstrap bounce before SIGUSR2 can preserve clients.
# See doc/event-multiplexer/handover.md for system-service adaptations and limits.
[Service]
Type=notify
NotifyAccess=main
Restart=on-failure
RestartSec=250ms
FileDescriptorStoreMax=2048
LimitNOFILE=8192
Environment=BUS_PROXY_HANDOVER_UNIT=opencode-bus-proxy.service
Environment=BUS_PROXY_HANDOVER_USER=true
Environment=BUS_PROXY_HANDOVER_SUCCESSOR=/usr/local/bin/opencode-bus-proxy
Environment=BUS_PROXY_HANDOVER_MODE=buffered
Environment=BUS_PROXY_HANDOVER_DRAIN_MS=2000
